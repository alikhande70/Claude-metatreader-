name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests sidecar tools --line-length 100
      - name: Type check
        run: mypy
      - name: MQL5 static check
        # Not a MetaEditor compile -- see tools/mql5check/README.md. It catches the
        # class of error that would otherwise be found only on the first round trip
        # to someone's terminal.
        run: python3 tools/mql5check/mql5check.py
      - name: Tests
        run: pytest -q
      - name: Sidecar imports cleanly without MetaTrader5
        # The sidecar is Windows-only in practice, but it must not fail to parse or import
        # on a machine without the package -- that is how a deployment discovers a typo.
        run: python -c "import ast,sys; ast.parse(open('sidecar/atlas_mt5_sidecar.py').read())"

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
